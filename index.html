<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Cards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111009;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 48px;
      padding: 80px 56px 60px;
      width: 100%;
      max-width: 1360px;
    }

    @media (max-width: 880px) {
      .page-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
        padding: 80px 28px 48px;
      }
    }

    @media (max-width: 420px) {
      .page-grid {
        gap: 18px;
        padding: 80px 16px 40px;
      }
    }

    /* ── Wrapper holds the card + compact stack space above ── */
    .carousel-wrapper {
      position: relative;
      padding-top: 56px;
      touch-action: pan-x;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    /* The actual sizing container for the card */
    .card-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      overflow: hidden;
      transform-origin: top center;
      will-change: transform, filter;
      transition:
        transform 0.44s cubic-bezier(0.22, 0.61, 0.36, 1),
        filter    0.44s ease-out;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── Stack: compact peek from above, depth-of-field blur, fan tilt ── */

    /* Front card — sharp, full brightness */
    .card[data-pos="0"] {
      transform: translate(0, 0) scale(1) rotate(0deg);
      filter: brightness(1) blur(0px);
      z-index: 4;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    }

    /* 1st behind — slightly tilted left, soft blur */
    .card[data-pos="1"] {
      transform: translate(0, -20px) scale(0.93) rotate(-1.8deg);
      filter: brightness(0.38) blur(1.5px);
      z-index: 3;
    }

    /* 2nd behind — tilt right, more blur */
    .card[data-pos="2"] {
      transform: translate(0, -34px) scale(0.87) rotate(1.2deg);
      filter: brightness(0.22) blur(3px);
      z-index: 2;
    }

    /* 3rd behind — minimal size, maximum blur, very dark */
    .card[data-pos="3"] {
      transform: translate(0, -44px) scale(0.81) rotate(-0.6deg);
      filter: brightness(0.10) blur(5px);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="page-grid">
    <div class="carousel-wrapper"><div class="card-stage"></div></div>
    <div class="carousel-wrapper"><div class="card-stage"></div></div>
    <div class="carousel-wrapper"><div class="card-stage"></div></div>
    <div class="carousel-wrapper"><div class="card-stage"></div></div>
  </div>

  <script>
    class StackCarousel {
      constructor(stage, images) {
        this.stage = stage;
        this.images = images;
        this.N = 4;
        this.current = 0;
        this.pool = [];   // pool[0] = front card
        this.busy = false;
        this.live = false;
        this.py = 0;
        this.dy = 0;

        this._build();
        this._listen();
      }

      _build() {
        // Append from back to front so DOM z-order matches visual
        for (let i = this.N - 1; i >= 0; i--) {
          const div = document.createElement('div');
          div.className = 'card';
          const img = document.createElement('img');
          img.src = this.images[i % this.images.length];
          img.alt = '';
          div.appendChild(img);
          this.stage.appendChild(div);
          this.pool.unshift(div);
        }
        this.pool.forEach((c, i) => (c.dataset.pos = i));
      }

      _src(card, idx) {
        const len = this.images.length;
        card.querySelector('img').src = this.images[((idx % len) + len) % len];
      }

      // New card rises first, then cascade ripples back through the stack
      next() {
        if (this.busy) return;
        this.busy = true;

        const [c0, c1, c2, c3] = this.pool;
        const S = 45; // stagger ms between each card

        c1.dataset.pos = '0';                          // new front — instant
        setTimeout(() => c2.dataset.pos = '1', S);
        setTimeout(() => c3.dataset.pos = '2', S * 2);
        setTimeout(() => c0.dataset.pos = '3', S * 3); // old front sinks last

        this.pool.push(this.pool.shift());
        this.current = (this.current + 1) % this.images.length;

        setTimeout(() => {
          this._src(this.pool[3], this.current + 3);
          this.busy = false;
        }, 460 + S * 3);
      }

      // Reverse cascade: front recedes first, back card rises last
      prev() {
        if (this.busy) return;
        this.busy = true;

        this.current = (this.current - 1 + this.images.length) % this.images.length;
        this._src(this.pool[3], this.current); // dark card, flash barely visible

        const [c0, c1, c2, c3] = this.pool;
        const S = 45;

        c0.dataset.pos = '1';
        setTimeout(() => c1.dataset.pos = '2', S);
        setTimeout(() => c2.dataset.pos = '3', S * 2);
        setTimeout(() => c3.dataset.pos = '0', S * 3);

        this.pool.unshift(this.pool.pop());
        setTimeout(() => (this.busy = false), 460 + S * 3);
      }

      _listen() {
        const wrapper = this.stage.parentElement;

        // Tap = next
        wrapper.addEventListener('click', () => {
          if (Math.abs(this.dy) < 8) this.next();
        });

        wrapper.addEventListener('pointerdown', e => {
          if (this.busy) return;
          this.live = true;
          this.py = e.clientY;
          this.dy = 0;
          wrapper.setPointerCapture(e.pointerId);
          e.preventDefault();
        });

        wrapper.addEventListener('pointermove', e => {
          if (!this.live) return;
          this.dy = e.clientY - this.py;

          // Live drag only for upward swipe (matches next-card direction)
          if (this.dy >= 0) return;

          const f = this.pool[0];
          f.style.transition = 'none';
          const progress = Math.min(Math.abs(this.dy) / 120, 1);
          const sc = 1 - progress * 0.19;
          const br = 1 - progress * 0.9;
          const bl = progress * 3;
          const rot = this.dy * 0.018;
          f.style.transform = `translate(0, ${this.dy}px) scale(${sc}) rotate(${rot}deg)`;
          f.style.filter = `brightness(${br}) blur(${bl}px)`;
        });

        const release = () => {
          if (!this.live) return;
          this.live = false;

          const f = this.pool[0];
          f.style.transition = '';
          f.style.transform = '';
          f.style.filter = '';

          if (this.dy < -55) this.next();
          else if (this.dy > 55) this.prev();
        };

        wrapper.addEventListener('pointerup', release);
        wrapper.addEventListener('pointercancel', release);
      }
    }

    // ── 4 stacks of culinary images ──────────────────────────────
    const SETS = [
      ['pasta1','risotto2','soup3','salad4','pizza5','steak6'],
      ['cake7','bread8','sushi9','burger10','tacos11','ramen12'],
      ['bowl13','curry14','grilled15','dessert16','wrap17','noodles18'],
      ['brunch19','smoothie20','tartine21','seafood22','roast23','crepe24'],
    ].map(seeds => seeds.map(s => `https://picsum.photos/seed/${s}/480/640`));

    document.querySelectorAll('.card-stage').forEach((stage, i) => {
      new StackCarousel(stage, SETS[i]);
    });
  </script>
</body>
</html>
