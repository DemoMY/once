<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Carousel</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #101010;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 44px;
      padding: 64px 56px;
      width: 100%;
      max-width: 1400px;
    }

    .carousel-wrapper {
      position: relative;
      aspect-ratio: 3 / 4;
      cursor: grab;
      touch-action: pan-x;
      user-select: none;
      -webkit-user-select: none;
    }

    .carousel-wrapper:active {
      cursor: grabbing;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      will-change: transform, filter;
      transition:
        transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        filter   0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* Stack peeks from top */
    .card[data-pos="0"] {
      transform: translate(0, 0) scale(1);
      filter: brightness(1);
      z-index: 4;
      box-shadow: 0 22px 52px rgba(0, 0, 0, 0.6);
    }

    .card[data-pos="1"] {
      transform: translate(0, -12px) scale(0.96);
      filter: brightness(0.58);
      z-index: 3;
    }

    .card[data-pos="2"] {
      transform: translate(0, -22px) scale(0.92);
      filter: brightness(0.36);
      z-index: 2;
    }

    .card[data-pos="3"] {
      transform: translate(0, -30px) scale(0.88);
      filter: brightness(0.2);
      z-index: 1;
    }

    /* Exit: flies up */
    .card[data-pos="exit"] {
      transform: translate(0, -115%) scale(0.93) rotate(4deg);
      filter: brightness(0.65);
      z-index: 5;
    }

    /* Entry: starts off-screen below */
    .card[data-pos="entry"] {
      transform: translate(0, 115%) scale(0.93) rotate(-4deg);
      filter: brightness(0.65);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="page-grid">
    <div class="carousel-wrapper"></div>
    <div class="carousel-wrapper"></div>
    <div class="carousel-wrapper"></div>
    <div class="carousel-wrapper"></div>
  </div>

  <script>
    class StackCarousel {
      constructor(el, images) {
        this.el = el;
        this.images = images;
        this.N = 4;
        this.current = 0;
        this.pool = [];
        this.busy = false;
        this.live = false;
        this.py = 0;
        this.dy = 0;
        this._build();
        this._listen();
      }

      _build() {
        for (let i = this.N - 1; i >= 0; i--) {
          const div = document.createElement('div');
          div.className = 'card';
          const img = document.createElement('img');
          img.src = this.images[i % this.images.length];
          img.alt = '';
          div.appendChild(img);
          this.el.appendChild(div);
          this.pool.unshift(div);
        }
        this.pool.forEach((c, i) => (c.dataset.pos = i));
      }

      _src(card, idx) {
        const len = this.images.length;
        card.querySelector('img').src = this.images[((idx % len) + len) % len];
      }

      next() {
        if (this.busy) return;
        this.busy = true;

        const front = this.pool[0];
        front.dataset.pos = 'exit';
        for (let i = 1; i < this.N; i++) this.pool[i].dataset.pos = i - 1;

        setTimeout(() => {
          this.current = (this.current + 1) % this.images.length;
          this._src(front, this.current + this.N - 1);
          this.pool.push(this.pool.shift());

          const back = this.pool[this.N - 1];
          back.style.transition = 'none';
          back.dataset.pos = String(this.N - 1);
          requestAnimationFrame(() => requestAnimationFrame(() => {
            back.style.transition = '';
            this.busy = false;
          }));
        }, 560);
      }

      prev() {
        if (this.busy) return;
        this.busy = true;

        this.current = (this.current - 1 + this.images.length) % this.images.length;

        const back = this.pool[this.N - 1];
        this._src(back, this.current);
        for (let i = 0; i < this.N - 1; i++) this.pool[i].dataset.pos = i + 1;

        back.style.transition = 'none';
        back.dataset.pos = 'entry';
        this.pool.unshift(this.pool.pop());

        requestAnimationFrame(() => requestAnimationFrame(() => {
          back.style.transition = '';
          back.dataset.pos = '0';
          setTimeout(() => (this.busy = false), 560);
        }));
      }

      _listen() {
        const el = this.el;

        el.addEventListener('pointerdown', e => {
          if (this.busy) return;
          this.live = true;
          this.py = e.clientY;
          this.dy = 0;
          el.setPointerCapture(e.pointerId);
          e.preventDefault();
        });

        el.addEventListener('pointermove', e => {
          if (!this.live) return;
          this.dy = e.clientY - this.py;
          const f = this.pool[0];
          f.style.transition = 'none';
          f.style.transform = `translate(0, ${this.dy}px) rotate(${this.dy * 0.02}deg)`;
        });

        const release = () => {
          if (!this.live) return;
          this.live = false;
          const f = this.pool[0];
          f.style.transition = '';
          f.style.transform = '';
          if (this.dy < -60) this.next();
          else if (this.dy > 60) this.prev();
        };

        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
      }
    }

    const SETS = [
      ['alpine1','alpine2','alpine3','alpine4','alpine5','alpine6'],
      ['ocean7','ocean8','ocean9','ocean10','ocean11','ocean12'],
      ['city13','city14','city15','city16','city17','city18'],
      ['forest19','forest20','forest21','forest22','forest23','forest24'],
    ].map(seeds => seeds.map(s => `https://picsum.photos/seed/${s}/400/560`));

    document.querySelectorAll('.carousel-wrapper').forEach((el, i) => {
      new StackCarousel(el, SETS[i]);
    });
  </script>
</body>
</html>
